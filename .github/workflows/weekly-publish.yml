name: Weekly publish (FAR gold read)

# Publishes NORTH weekly gold call to Telegram every Sunday at 22:00 UTC.
# Depends on data-refresh having run earlier the same day.
# Also resolves the prior week's call outcome.
#
# Manual trigger available via "Run workflow" button.

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip data-freshness check (for testing)"
        required: false
        default: "false"

concurrency:
  group: weekly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOLDTRADER_TG_TOKEN: ${{ secrets.GOLDTRADER_TG_TOKEN }}
      GOLDTRADER_TG_CHAT: ${{ secrets.GOLDTRADER_TG_CHAT }}
      GOLDTRADER_TG_CHAT_PUBLIC: ${{ secrets.GOLDTRADER_TG_CHAT_PUBLIC }}
      GOLDTRADER_STRICT_PUBLIC: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore whatever the most recent data-refresh cached.
      - name: Restore Dukascopy cache
        uses: actions/cache/restore@v4
        with:
          path: data/external/dukascopy/
          key: dukascopy-restore-${{ github.run_id }}
          restore-keys: |
            dukascopy-

      # If cache miss, do an inline fetch as fallback so the publish
      # doesn't fail on a cold cache.
      - name: Fallback data fetch if cache empty
        run: |
          if [ ! -f data/external/dukascopy/XAUUSD_5m.csv ]; then
              echo "[fallback] cache miss, doing full XAUUSD backfill"
              python scripts/fetch_dukascopy_xauusd.py
          else
              age_days=$(python -c "
          import pandas as pd
          d = pd.read_csv('data/external/dukascopy/XAUUSD_5m.csv', parse_dates=['ts'])
          last = pd.to_datetime(d['ts'], utc=True).max()
          print(int((pd.Timestamp.now(tz='UTC') - last).total_seconds() // 86400))
          ")
              echo "[fallback] XAUUSD data age: ${age_days} days"
              if [ "$age_days" -gt "2" ]; then
                  echo "[fallback] stale, refreshing"
                  python scripts/fetch_dukascopy_xauusd.py
              fi
          fi

      - name: Publish weekly call
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
              python scripts/far_weekly_gold_read_publish.py --force
          else
              python scripts/far_weekly_gold_read_publish.py
          fi

      - name: Refresh site JSON (live_pnl_pct + hourly OHLC series)
        run: python scripts/north_site_refresh.py
        continue-on-error: true

      - name: Build history archive (index + per-week detail)
        run: python scripts/build_history_archive.py
        continue-on-error: true

      - name: Snapshot call history to Telegram DM + GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backup_calls_snapshot.py
        continue-on-error: true

      - name: Regenerate public track record + retirement wall
        run: |
          python scripts/render_track_record.py
          python scripts/build_retirement_wall.py

      - name: Commit updated logs + site data + launch docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/far_weekly_calls.jsonl \
                  data/far_weekly_v2_shadow.jsonl \
                  data/far_weekly_ensemble_shadow.jsonl \
                  site/data/*.json \
                  site/data/history/*.json \
                  site/feed.xml \
                  site/api/*.json \
                  docs/launch/track_record_current.md \
                  docs/launch/retirement_wall.md 2>/dev/null || true
          if git diff --cached --quiet; then
              echo "No log changes to commit"
          else
              git commit -m "publish: weekly call $(date -u +%Y-%m-%d) via github-actions"
              # --autostash covers any tracked-but-unstaged files the publish
              # script may have written that aren't in the add list above.
              # Without it, rebase refuses with "cannot pull with rebase:
              # You have unstaged changes" and the push retry loop is useless.
              for attempt in 1 2 3; do
                  git pull --rebase --autostash origin main && git push && break
                  echo "push attempt $attempt failed, retrying"
                  sleep $((attempt * 5))
              done
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.GOLDTRADER_TG_TOKEN }}
          TG_CHAT: ${{ secrets.GOLDTRADER_TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
              echo "TG creds not set — cannot notify"
              exit 0
          fi
          MSG="🚨 GH Actions FAILED: ${{ github.workflow }}
          run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" > /dev/null || echo "notify request failed"
