name: Daily brief (NORTH midweek position update)

# Mon-Fri at 12:00 UTC: publish a 3-section brief (Signal Health,
# Cost Radar, What Kills This Call) if a directional weekly call is live.
# Skips silently on FLAT weeks — no engagement theater on sitting-out weeks.
#
# 12:00 UTC is right after Europe fully opens and before the US session,
# giving traders a mid-day read on how the week's position is doing.

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOLDTRADER_TG_TOKEN: ${{ secrets.GOLDTRADER_TG_TOKEN }}
      GOLDTRADER_TG_CHAT: ${{ secrets.GOLDTRADER_TG_CHAT }}
      GOLDTRADER_TG_CHAT_PUBLIC: ${{ secrets.GOLDTRADER_TG_CHAT_PUBLIC }}
      GOLDTRADER_STRICT_PUBLIC: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Dukascopy cache
        uses: actions/cache/restore@v4
        with:
          path: data/external/dukascopy/
          key: daily-brief-restore-${{ github.run_id }}
          restore-keys: |
            dukascopy-

      - name: Refresh XAUUSD to now (brief needs fresh spot)
        run: python scripts/fetch_dukascopy_xauusd.py
        continue-on-error: true

      - name: Refresh site JSON (live_pnl_pct + hourly OHLC series)
        run: python scripts/north_site_refresh.py
        continue-on-error: true

      - name: Publish daily brief
        run: python scripts/north_daily_brief.py --audience public

      - name: Commit brief log + site JSON refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/north_daily_brief.jsonl \
                  site/data/far_weekly_current.json \
                  site/data/far_weekly_price_series.json \
                  site/data/far_daily_briefs.json 2>/dev/null || true
          if git diff --cached --quiet; then
              echo "No brief log or site JSON changes to commit"
          else
              git commit -m "brief: daily brief tick $(date -u +%Y-%m-%d)"
              for attempt in 1 2 3; do
                  git pull --rebase --autostash origin main && git push && break
                  echo "push attempt $attempt failed, retrying"
                  sleep $((attempt * 5))
              done
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.GOLDTRADER_TG_TOKEN }}
          TG_CHAT: ${{ secrets.GOLDTRADER_TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
              echo "TG creds not set — cannot notify"
              exit 0
          fi
          MSG="🚨 GH Actions FAILED: ${{ github.workflow }}
          run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" > /dev/null || echo "notify request failed"
